<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Mesero</title>
    <style>
        body { font-family: sans-serif; background: #f4f4f4; padding: 20px; }
        .mesa-card { background: white; padding: 20px; border-radius: 15px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .status { font-weight: bold; padding: 5px 10px; border-radius: 5px; font-size: 12px; }
        .Pidiendo { background: #ffeaa7; color: #d35400; }
        .Listo { background: #55efc4; color: #00b894; animation: blink 1s infinite; }
        .btn { background: black; color: white; border: none; padding: 10px; border-radius: 5px; cursor: pointer; }
        @keyframes blink { 50% { opacity: 0.5; } }
    </style>
</head>
<body>
    <h2 id="waiter-title">Mesero: --</h2>
    <div id="mis-mesas"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, collection, query, where, onSnapshot, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        const firebaseConfig = { /* TU CONFIG AQUÍ */ };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const user = new URLSearchParams(window.location.search).get('user');
        document.getElementById('waiter-title').innerText = `Mesero: ${user}`;

        const q = query(collection(db, "mesas"), where("meseroId", "==", user));

        onSnapshot(q, (snap) => {
            const container = document.getElementById('mis-mesas');
            container.innerHTML = "";
            snap.forEach(d => {
                const m = d.data();
                if(m.estado === "Libre") return;

                container.innerHTML += `
                    <div class="mesa-card">
                        <div>
                            <strong>MESA ${m.numero || d.id.split('_')[1]}</strong><br>
                            <span>${m.pedidoActual || 'Solo llamado'}</span>
                        </div>
                        <div class="status ${m.estado}">${m.estado}</div>
                        <button class="btn" onclick="limpiarMesa('${d.id}')">OK</button>
                    </div>`;
                
                // Vibración si hay algo nuevo
                if(["Pidiendo", "Listo", "Llamando"].includes(m.estado)) {
                    if("vibrate" in navigator) navigator.vibrate(200);
                }
            });
        });

        window.limpiarMesa = async (id) => {
            await updateDoc(doc(db, "mesas", id), { estado: "Libre", pedidoActual: "" });
        };
    </script>
</body>
</html>
