<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menú Digital</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body { background: #0d0d0d; color: white; font-family: sans-serif; margin: 0; padding-bottom: 100px; }
        .header { padding: 40px 20px; background: linear-gradient(to bottom, #222, #0d0d0d); text-align: center; }
        .gold { color: #c9a86a; letter-spacing: 3px; font-size: 12px; font-weight: bold; }
        .menu-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; padding: 15px; }
        .card { background: white; color: black; border-radius: 20px; overflow: hidden; }
        .card img { width: 100%; height: 130px; object-fit: cover; }
        .card-content { padding: 12px; }
        .price { font-weight: 900; font-size: 18px; margin: 5px 0; }
        .btn-order { background: #000; color: white; border: none; width: 100%; padding: 10px; border-radius: 10px; font-weight: bold; cursor: pointer; }
        
        .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.95); display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 100; }
        .nav-bottom { position: fixed; bottom: 0; width: 100%; background: white; padding: 20px; display: flex; justify-content: space-around; box-sizing: border-box; }
        .btn-action { background: #ff4757; color: white; border: none; padding: 12px 20px; border-radius: 30px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="header">
        <div class="gold">RISTORANTE MODERNO</div>
        <h1 id="mesa-titulo">MESA --</h1>
        <small id="waiter-name">Cargando mesero...</small>
    </div>

    <div class="menu-grid" id="menu-items"></div>

    <div class="overlay" id="overlay">
        <h2 id="ov-text">⌛ Pedido enviado</h2>
        <button onclick="document.getElementById('overlay').style.display='none'" style="background:white; border:none; padding:10px 20px; border-radius:10px;">Cerrar</button>
    </div>

    <div class="nav-bottom">
        <button class="btn-action" onclick="notificar('Llamando')">🔔 LLAMAR MESERO</button>
        <button class="btn-action" style="background:#2ed573" onclick="notificar('Cuenta')">💰 CUENTA</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, doc, onSnapshot, updateDoc, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        const firebaseConfig = { /* TU CONFIG AQUÍ */ };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const id = new URLSearchParams(window.location.search).get('id') || "1";
        const mesaId = `mesa_${id}`;
        document.getElementById('mesa-titulo').innerText = `MESA ${id}`;

        // Cargar productos
        const prodSnap = await getDocs(collection(db, "productos"));
        prodSnap.forEach(d => {
            const p = d.data();
            document.getElementById('menu-items').innerHTML += `
                <div class="card">
                    <img src="${p.imagen}">
                    <div class="card-content">
                        <strong>${p.nombre}</strong>
                        <div class="price">$${p.precio}</div>
                        <button class="btn-order" onclick="pedir('${p.nombre}')">ORDENAR</button>
                    </div>
                </div>`;
        });

        window.pedir = async (plato) => {
            await updateDoc(doc(db, "mesas", mesaId), { estado: "Pidiendo", pedidoActual: plato });
        };

        window.notificar = async (estado) => {
            await updateDoc(doc(db, "mesas", mesaId), { estado: estado });
        };

        // Escuchar cambios
        onSnapshot(doc(db, "mesas", mesaId), (d) => {
            const data = d.data();
            document.getElementById('waiter-name').innerText = `Mesero asignado: ${data.meseroId || 'General'}`;
            const ov = document.getElementById('overlay');
            if(data.estado !== "Libre" && data.estado !== "Entregado") {
                ov.style.display = "flex";
                document.getElementById('ov-text').innerText = `Estado: ${data.estado}`;
            } else {
                ov.style.display = "none";
            }
        });
    </script>
</body>
</html>
