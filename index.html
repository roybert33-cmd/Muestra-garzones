<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ristorante Hub</title>
    <style>
        body { font-family: sans-serif; background: #0e0e0e; color: white; text-align: center; padding: 20px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; max-width: 800px; margin: 20px auto; }
        a { background: white; color: black; padding: 15px; border-radius: 10px; text-decoration: none; font-weight: bold; font-size: 14px; }
        .staff { background: #c9a86a; }
        h2 { border-bottom: 2px solid #333; padding-bottom: 10px; margin-top: 30px; }
    </style>
</head>
<body>
    <h1>RISTORANTE MODERNO</h1>
    
    <h2>MESAS (CLIENTES)</h2>
    <div class="grid" id="grid-mesas"></div>

    <h2>PERSONAL</h2>
    <div class="grid">
        <a href="cocina.html" class="staff">👨‍🍳 COCINA</a>
        <a href="admin.html" class="staff">⚙️ ADMINISTRACIÓN</a>
    </div>

    <h2>MESEROS ASIGNADOS</h2>
    <div class="grid">
        <a href="mesero.html?user=Juan">🧑‍💼 Juan</a>
        <a href="mesero.html?user=Pedro">🧑‍💼 Pedro</a>
        <a href="mesero.html?user=Maria">🧑‍💼 Maria</a>
        <a href="mesero.html?user=Ana">🧑‍💼 Ana</a>
    </div>

    <script>
        const container = document.getElementById('grid-mesas');
        for(let i=1; i<=20; i++) {
            container.innerHTML += `<a href="mesa.html?id=${i}">Mesa ${i}</a>`;
        }
    </script>
</body>
</html>
